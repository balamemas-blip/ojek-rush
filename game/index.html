<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Ojek Rush — arcade delivery game: ride your motorbike through traffic, pick up food orders and deliver them before time runs out.">
<title>Ojek Rush — Antar Pesanan!</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1a1210; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Ojek Rush: ride your motorbike through traffic, pick up food orders and deliver them before time runs out"></canvas>
<noscript><p style="color:#fff;font-family:system-ui">Ojek Rush butuh JavaScript untuk jalan.</p></noscript>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
